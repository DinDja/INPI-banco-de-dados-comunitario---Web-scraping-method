<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>INPI Search API - Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }
    
    .container {
      max-width: 1400px;
      margin: 0 auto;
    }
    
    header {
      background: white;
      padding: 20px 30px;
      border-radius: 10px;
      margin-bottom: 20px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    
    h1 {
      color: #667eea;
      font-size: 28px;
      margin-bottom: 5px;
    }
    
    .subtitle {
      color: #666;
      font-size: 14px;
    }
    
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
      margin-bottom: 20px;
    }
    
    .card {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    
    .card h3 {
      color: #333;
      font-size: 16px;
      margin-bottom: 15px;
      border-bottom: 2px solid #667eea;
      padding-bottom: 10px;
    }
    
    .metric {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #eee;
    }
    
    .metric:last-child {
      border-bottom: none;
    }
    
    .metric-label {
      color: #666;
      font-size: 14px;
    }
    
    .metric-value {
      font-weight: bold;
      color: #667eea;
      font-size: 18px;
    }
    
    .metric-value.warning {
      color: #f59e0b;
    }
    
    .metric-value.success {
      color: #10b981;
    }
    
    .chart-container {
      position: relative;
      height: 250px;
      margin-top: 20px;
    }
    
    .query-list {
      max-height: 300px;
      overflow-y: auto;
    }
    
    .query-item {
      padding: 8px 0;
      border-bottom: 1px solid #eee;
      display: flex;
      justify-content: space-between;
    }
    
    .query-text {
      color: #333;
      font-size: 14px;
    }
    
    .query-count {
      background: #667eea;
      color: white;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 12px;
    }
    
    .insight {
      padding: 15px;
      margin-bottom: 10px;
      border-radius: 8px;
      border-left: 4px solid;
    }
    
    .insight.warning {
      background: #fef3c7;
      border-color: #f59e0b;
    }
    
    .insight.info {
      background: #dbeafe;
      border-color: #3b82f6;
    }
    
    .insight.success {
      background: #d1fae5;
      border-color: #10b981;
    }
    
    .insight-title {
      font-weight: bold;
      margin-bottom: 5px;
    }
    
    .insight-message {
      font-size: 14px;
      color: #666;
    }
    
    .refresh-btn {
      background: #667eea;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 14px;
      margin-top: 10px;
    }
    
    .refresh-btn:hover {
      background: #5568d3;
    }
    
    .loading {
      text-align: center;
      padding: 40px;
      color: white;
      font-size: 18px;
    }
    
    .error {
      background: #fee2e2;
      color: #dc2626;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 20px;
    }
    
    @media (max-width: 768px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🚀 INPI Search API Dashboard</h1>
      <p class="subtitle">Monitoramento em tempo real - Atualizado: <span id="lastUpdate">-</span></p>
      <button class="refresh-btn" onclick="loadData()">🔄 Atualizar</button>
    </header>
    
    <div id="error" class="error" style="display: none;"></div>
    
    <div id="loading" class="loading">Carregando dados...</div>
    
    <div id="content" style="display: none;">
      <div class="grid">
        <div class="card">
          <h3>📊 Overview</h3>
          <div id="overview"></div>
        </div>
        
        <div class="card">
          <h3>💾 Database</h3>
          <div id="database"></div>
        </div>
        
        <div class="card">
          <h3>🔥 Cache</h3>
          <div id="cache"></div>
        </div>
        
        <div class="card">
          <h3>📈 Performance</h3>
          <div id="performance"></div>
        </div>
      </div>
      
      <div class="grid">
        <div class="card" style="grid-column: span 2;">
          <h3>📊 Queries nas Últimas 24 Horas</h3>
          <div class="chart-container">
            <canvas id="hourlyChart"></canvas>
          </div>
        </div>
        
        <div class="card">
          <h3>🔥 Top Queries</h3>
          <div class="query-list" id="topQueries"></div>
        </div>
      </div>
      
      <div class="grid">
        <div class="card">
          <h3>⚠️ Zero Results</h3>
          <div class="query-list" id="zeroResults"></div>
        </div>
        
        <div class="card" style="grid-column: span 2;">
          <h3>💡 Insights</h3>
          <div id="insights"></div>
        </div>
      </div>
    </div>
  </div>
  
  <script>
    const API_TOKEN = 'admin-secret-token';
    const API_URL = '/api/admin/realtime';
    
    let hourlyChart = null;
    
    async function loadData() {
      try {
        const response = await fetch(API_URL, {
          headers: {
            'x-admin-token': API_TOKEN,
          },
        });
        
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}: ${response.statusText}`);
        }
        
        const data = await response.json();
        
        if (!data.ok) {
          throw new Error(data.error || 'Erro desconhecido');
        }
        
        document.getElementById('loading').style.display = 'none';
        document.getElementById('content').style.display = 'block';
        document.getElementById('error').style.display = 'none';
        document.getElementById('lastUpdate').textContent = new Date().toLocaleString('pt-BR');
        
        renderOverview(data.overview);
        renderDatabase(data.database);
        renderCache(data.cache);
        renderPerformance(data.database);
        renderHourlyChart(data.analytics.hourlyTrend);
        renderTopQueries(data.analytics.topQueries);
        renderZeroResults(data.analytics.zeroResultQueries);
        renderInsights(data.insights);
        
      } catch (error) {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('error').style.display = 'block';
        document.getElementById('error').textContent = `Erro: ${error.message}`;
      }
    }
    
    function renderOverview(overview) {
      document.getElementById('overview').innerHTML = `
        <div class="metric">
          <span class="metric-label">Total Queries</span>
          <span class="metric-value">${overview.total_queries.toLocaleString()}</span>
        </div>
        <div class="metric">
          <span class="metric-label">Queries Únicas</span>
          <span class="metric-value">${overview.unique_queries.toLocaleString()}</span>
        </div>
        <div class="metric">
          <span class="metric-label">Zero Results</span>
          <span class="metric-value ${overview.zero_result_rate > 10 ? 'warning' : 'success'}">${overview.zero_result_rate}%</span>
        </div>
        <div class="metric">
          <span class="metric-label">Tempo Médio</span>
          <span class="metric-value">${overview.avg_response_time_ms}ms</span>
        </div>
      `;
    }
    
    function renderDatabase(db) {
      document.getElementById('database').innerHTML = `
        <div class="metric">
          <span class="metric-label">Registros</span>
          <span class="metric-value">${db.total_records.toLocaleString()}</span>
        </div>
        <div class="metric">
          <span class="metric-label">Arquivos</span>
          <span class="metric-value">${db.total_files}</span>
        </div>
        <div class="metric">
          <span class="metric-label">Search Engine</span>
          <span class="metric-value">${db.search_engine}</span>
        </div>
        <div class="metric">
          <span class="metric-label">Load Time</span>
          <span class="metric-value ${db.load_duration_ms > 5000 ? 'warning' : 'success'}">${db.load_duration_ms}ms</span>
        </div>
      `;
    }
    
    function renderCache(cache) {
      document.getElementById('cache').innerHTML = `
        <div class="metric">
          <span class="metric-label">Hit Rate</span>
          <span class="metric-value ${cache.hitRate > 50 ? 'success' : 'warning'}">${cache.hitRate}%</span>
        </div>
        <div class="metric">
          <span class="metric-label">Hits</span>
          <span class="metric-value">${cache.hits.toLocaleString()}</span>
        </div>
        <div class="metric">
          <span class="metric-label">Misses</span>
          <span class="metric-value">${cache.misses.toLocaleString()}</span>
        </div>
        <div class="metric">
          <span class="metric-label">Tamanho</span>
          <span class="metric-value">${cache.size}/${cache.maxSize}</span>
        </div>
      `;
    }
    
    function renderPerformance(db) {
      const indexStats = db.index_stats || {};
      document.getElementById('performance').innerHTML = `
        <div class="metric">
          <span class="metric-label">Documentos Indexados</span>
          <span class="metric-value">${indexStats.documentCount || 0}</span>
        </div>
        <div class="metric">
          <span class="metric-label">Termos no Índice</span>
          <span class="metric-value">${indexStats.invertedIndexSize || 0}</span>
        </div>
        <div class="metric">
          <span class="metric-label">Build Time</span>
          <span class="metric-value">${indexStats.buildDurationMs || 0}ms</span>
        </div>
      `;
    }
    
    function renderHourlyChart(hourlyData) {
      const ctx = document.getElementById('hourlyChart').getContext('2d');
      
      if (hourlyChart) {
        hourlyChart.destroy();
      }
      
      hourlyChart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: hourlyData.map(d => d.hour),
          datasets: [
            {
              label: 'Queries',
              data: hourlyData.map(d => d.queries),
              borderColor: '#667eea',
              backgroundColor: 'rgba(102, 126, 234, 0.1)',
              tension: 0.4,
              fill: true,
            },
            {
              label: 'Zero Results',
              data: hourlyData.map(d => d.zeroResults),
              borderColor: '#f59e0b',
              backgroundColor: 'rgba(245, 158, 11, 0.1)',
              tension: 0.4,
              fill: true,
            },
          ],
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              display: true,
              position: 'top',
            },
          },
          scales: {
            y: {
              beginAtZero: true,
            },
          },
        },
      });
    }
    
    function renderTopQueries(queries) {
      const container = document.getElementById('topQueries');
      container.innerHTML = queries.length === 0 
        ? '<div style="color: #999; text-align: center; padding: 20px;">Sem dados</div>'
        : queries.map((q, i) => `
            <div class="query-item">
              <span class="query-text">${i + 1}. ${q.query}</span>
              <span class="query-count">${q.count} buscas</span>
            </div>
          `).join('');
    }
    
    function renderZeroResults(queries) {
      const container = document.getElementById('zeroResults');
      container.innerHTML = queries.length === 0 
        ? '<div style="color: #999; text-align: center; padding: 20px;">Nenhuma query sem resultados</div>'
        : queries.map((q, i) => `
            <div class="query-item">
              <span class="query-text">${i + 1}. ${q}</span>
            </div>
          `).join('');
    }
    
    function renderInsights(insights) {
      const container = document.getElementById('insights');
      container.innerHTML = insights.length === 0
        ? '<div style="color: #999; text-align: center; padding: 20px;">Nenhum insight no momento</div>'
        : insights.map(insight => `
            <div class="insight ${insight.type}">
              <div class="insight-title">${insight.title}</div>
              <div class="insight-message">${insight.message}</div>
              <div style="margin-top: 8px; font-size: 13px; color: #666;">
                💡 ${insight.suggestion}
              </div>
            </div>
          `).join('');
    }
    
    // Load data on page load
    loadData();
    
    // Auto-refresh every 30 seconds
    setInterval(loadData, 30000);
  </script>
</body>
</html>
